<!DOCTYPE html>
<html lang="en">
<head>
    <meta charst="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky Notes Task Manager</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="index.html">Sticky Notes</a>
            <button class="btn btn-outline-light" data-bs-toggle="modal" data-bs-target="#noteModal" onclick="clearForm()">New Note</button>
        </div>
    </nav>

    <!-- Sticky Notes Container -->
    <div class="container">
        <div class="row" id="notesContainer">
            <!-- Notes will be loaded here dynamically via script.js -->
        </div>
    </div>

    <!-- Model Form for Create / Edit Note -->
    <div class="modal fade" id="noteModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">New Note</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="noteId">
                    <div class="mb-3">
                        <label for="noteTitleInput" class="form-label">Title</label>
                        <input type="text" class="form-control" id="noteTitleInput" placeholder="Note title..." required>
                    </div>
                    <div class="mb-3">
                        <label for="noteContentInput" class="form-label">Content</label>
                        <textarea class="form-control" id="noteContentInput" rows="4" placeholder="Note Content..." required></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="saveNote()">Save Note</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JavaScript -->
    <script src="js/script.js"></script>
</body>
</html>
